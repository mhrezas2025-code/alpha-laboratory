<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <title>
    ورود | آزمایشگاه تخصصی آلفا
  </title>

  <style>

    :root {
      --primary: #0b7285;
      --primary-dark: #063b57;
      --secondary: #087f5b;
      --accent: #32cbd0;
      --light: #f1fbfc;
      --text: #183b42;
      --muted: #6b7f85;
      --border: rgba(11,114,133,.12);
      --shadow: 0 15px 40px rgba(7,59,76,.12);
    }

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      font-family:
        Tahoma,
        Arial,
        sans-serif;

      color: var(--text);

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(0,150,136,.10),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 20%,
          rgba(0,188,212,.10),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #f7fbfc,
          #eef7f8
        );

    }

    .login-container {

      width: 100%;

      max-width: 430px;

    }

    .login-card {

      background: white;

      border:
        1px solid var(--border);

      border-radius: 24px;

      padding: 35px 30px;

      box-shadow: var(--shadow);

    }

    .logo-wrapper {

      text-align: center;

      margin-bottom: 20px;

    }

    .logo {

      width: 90px;

      height: 90px;

      object-fit: contain;

      border-radius: 18px;

      background: white;

      padding: 5px;

      box-shadow:
        0 8px 20px rgba(7,59,76,.10);

    }

    h1 {

      margin: 0 0 5px;

      text-align: center;

      color: var(--primary-dark);

      font-size: 24px;

    }

    .subtitle {

      margin: 0 0 30px;

      text-align: center;

      color: var(--muted);

      font-size: 13px;

    }

    .form-group {

      margin-bottom: 18px;

    }

    label {

      display: block;

      margin-bottom: 7px;

      color: var(--primary-dark);

      font-size: 13px;

      font-weight: bold;

    }

    input {

      width: 100%;

      padding: 13px 14px;

      border:
        1px solid #dcebed;

      border-radius: 12px;

      outline: none;

      font-family: inherit;

      font-size: 13px;

      background: #fbfeff;

      transition:
        border-color .2s ease,
        box-shadow .2s ease;

    }

    input:focus {

      border-color:
        var(--primary);

      box-shadow:
        0 0 0 3px
        rgba(11,114,133,.08);

    }

    .login-button {

      width: 100%;

      border: none;

      border-radius: 12px;

      padding: 13px;

      background:
        linear-gradient(
          135deg,
          var(--primary-dark),
          var(--primary)
        );

      color: white;

      font-family: inherit;

      font-size: 13px;

      font-weight: bold;

      cursor: pointer;

      transition:
        transform .2s ease,
        opacity .2s ease;

    }

    .login-button:hover {

      transform:
        translateY(-1px);

    }

    .login-button:disabled {

      opacity: .65;

      cursor: not-allowed;

      transform: none;

    }

    .message {

      display: none;

      margin-bottom: 18px;

      padding: 12px 14px;

      border-radius: 12px;

      font-size: 12px;

      line-height: 1.8;

    }

    .message.error {

      display: block;

      color: #9b2c2c;

      background: #fff0f0;

      border:
        1px solid #ffd5d5;

    }

    .message.success {

      display: block;

      color: #087f5b;

      background: #e6fcf5;

      border:
        1px solid #b7efd9;

    }

    .footer {

      margin-top: 20px;

      text-align: center;

      color: var(--muted);

      font-size: 10px;

      line-height: 1.8;

    }

    .footer span {

      color: var(--primary);

    }

    .back-link {

      display: block;

      margin-top: 18px;

      text-align: center;

      color: var(--primary);

      text-decoration: none;

      font-size: 12px;

    }

    .back-link:hover {

      text-decoration: underline;

    }

    @media (max-width: 500px) {

      .login-card {

        padding: 28px 20px;

      }

      h1 {

        font-size: 21px;

      }

    }

  </style>

</head>


<body>


<div class="login-container">


  <div class="login-card">


    <div class="logo-wrapper">

      <img
        src="لوگو.jfif"
        alt="لوگوی آزمایشگاه تخصصی آلفا"
        class="logo"
      >

    </div>


    <h1>
      آزمایشگاه تخصصی آلفا
    </h1>


    <p class="subtitle">
      ورود به سامانه آلفا
    </p>


    <div
      id="message"
      class="message"
    ></div>


    <form id="loginForm">


      <div class="form-group">

        <label for="email">
          ایمیل
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="ایمیل خود را وارد کنید"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          رمز عبور
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="رمز عبور را وارد کنید"
          required
        >

      </div>


      <button
        id="loginButton"
        class="login-button"
        type="submit"
      >
        ورود به سامانه
      </button>


    </form>


    <a
      href="index.html"
      class="back-link"
    >
      ← بازگشت به سایت آزمایشگاه آلفا
    </a>


  </div>


  <div class="footer">

    © آزمایشگاه تخصصی آلفا —

    <span>
      Alpha Specialized Laboratory
    </span>

  </div>


</div>


<script>

/* =====================================================
   ALPHA LOGIN
   ROLE BASED REDIRECTION
===================================================== */

(function () {

  "use strict";


  /* =====================================================
     SUPABASE CONFIG
  ===================================================== */

  const SUPABASE_URL =
    "https://znnfjaetnmzttcueqxpw.supabase.co";


  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_rtOJjJKZJOHv0NPDYRgvJw_dtXV_DUS";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  console.log(
    "Alpha Login initialized."
  );


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const loginForm =
    document.getElementById(
      "loginForm"
    );


  const emailInput =
    document.getElementById(
      "email"
    );


  const passwordInput =
    document.getElementById(
      "password"
    );


  const loginButton =
    document.getElementById(
      "loginButton"
    );


  const message =
    document.getElementById(
      "message"
    );


  /* =====================================================
     MESSAGE
  ===================================================== */

  function showMessage(
    text,
    type = "error"
  ) {

    message.textContent =
      text;

    message.className =
      `message ${type}`;

  }


  function hideMessage() {

    message.textContent =
      "";

    message.className =
      "message";

  }


  /* =====================================================
     REDIRECT BY ROLE
  ===================================================== */

  async function redirectByRole(
    user
  ) {

    if (!user) {

      showMessage(
        "کاربر وارد نشده است."
      );

      return;

    }


    console.log(
      "Authenticated user:",
      user.id
    );


    console.log(
      "User email:",
      user.email
    );


    /* =================================================
       LOAD USER PROFILE
    ================================================= */

    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from(
          "user_profiles"
        )
        .select(
          "id, full_name, role"
        )
        .eq(
          "id",
          user.id
        )
        .maybeSingle();


    if (profileError) {

      console.error(
        "Profile error:",
        profileError
      );


      showMessage(
        "ورود انجام شد، اما دریافت سطح دسترسی با خطا مواجه شد."
      );

      return;

    }


    /* =================================================
       NO PROFILE
    ================================================= */

    if (!profile) {

      console.error(
        "No user profile found for:",
        user.id
      );


      showMessage(
        "برای این حساب سطح دسترسی ثبت نشده است."
      );

      return;

    }


    console.log(
      "User profile:",
      profile
    );


    /* =================================================
       ADMIN
    ================================================= */

    if (
      profile.role ===
      "admin"
    ) {

      console.log(
        "Role: ADMIN"
      );


      showMessage(
        "ورود موفق بود. در حال انتقال به پنل مدیریت مرکزی...",
        "success"
      );


      setTimeout(
        function () {

          window.location.replace(
            "admin-dashboard.html"
          );

        },
        500
      );


      return;

    }


    /* =================================================
       PARTNER
    ================================================= */

    if (
      profile.role ===
      "partner"
    ) {

      console.log(
        "Role: PARTNER"
      );


      showMessage(
        "ورود موفق بود. در حال انتقال به پرتال آزمایشگاه همکار...",
        "success"
      );


      setTimeout(
        function () {

          window.location.replace(
            "partner-dashboard.html"
          );

        },
        500
      );


      return;

    }


    /* =================================================
       UNKNOWN ROLE
    ================================================= */

    console.warn(
      "Unknown user role:",
      profile.role
    );


    showMessage(
      "نقش این حساب در سامانه مشخص نشده است. لطفاً با مدیر سیستم تماس بگیرید."
    );

  }


  /* =====================================================
     LOGIN
  ===================================================== */

  loginForm.addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();


      hideMessage();


      const email =
        emailInput.value
          .trim()
          .toLowerCase();


      const password =
        passwordInput.value;


      if (
        !email ||
        !password
      ) {

        showMessage(
          "لطفاً ایمیل و رمز عبور را وارد کنید."
        );

        return;

      }


      loginButton.disabled =
        true;


      loginButton.textContent =
        "در حال ورود...";


      console.log(
        "Login attempt:",
        email
      );


      try {


        /* =============================================
           CLEAR OLD SESSION
        ============================================= */

        const {
          error: signOutError
        } =
          await supabaseClient
            .auth
            .signOut();


        if (signOutError) {

          console.warn(
            "Previous session signOut warning:",
            signOutError
          );

        }


        /* =============================================
           SIGN IN
        ============================================= */

        const {
          data,
          error
        } =
          await supabaseClient
            .auth
            .signInWithPassword({

              email:
                email,

              password:
                password

            });


        if (error) {

          console.error(
            "Login error:",
            error
          );


          showMessage(
            "ورود ناموفق بود. ایمیل یا رمز عبور را بررسی کنید."
          );


          return;

        }


        if (
          !data ||
          !data.user
        ) {

          showMessage(
            "ورود انجام نشد. لطفاً دوباره تلاش کنید."
          );


          return;

        }


        console.log(
          "Login successful:",
          data.user.id
        );


        /* =============================================
           ROLE REDIRECTION
        ============================================= */

        await redirectByRole(
          data.user
        );


      }
      catch (error) {

        console.error(
          "Unexpected login error:",
          error
        );


        showMessage(
          "خطای غیرمنتظره در هنگام ورود رخ داد."
        );

      }
      finally {

        loginButton.disabled =
          false;

        loginButton.textContent =
          "ورود به سامانه";

      }

    }
  );


  /* =====================================================
     AUTH STATE
  ===================================================== */

  supabaseClient
    .auth
    .onAuthStateChange(
      function (
        event,
        session
      ) {

        console.log(
          "Auth state:",
          event,
          session?.user?.id || null
        );

      }
    );


})();

</script>


</body>

</html>
